name: Decode base64 images

on:
  push:
    paths:
      - '_b64/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decode-b64
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Decode _b64 files / bundle, remove the staging tree, and push
        run: |
          set -euo pipefail
          git pull --ff-only origin main || true
          if [ ! -d _b64 ]; then
            echo "No _b64 directory; nothing to decode."
            exit 0
          fi

          # Multi-part tar bundle: _b64/bundle/partNN + _b64/bundle/count + _b64/bundle/sha256
          if [ -f _b64/bundle/count ]; then
            need=$(tr -d '[:space:]' < _b64/bundle/count)
            have=$(ls _b64/bundle/ | grep -c '^part' || true)
            if [ "$have" -lt "$need" ]; then
              echo "Bundle incomplete: $have/$need parts. Waiting for the next push."
              exit 0
            fi
            cat $(ls _b64/bundle/part* | sort) | base64 -d > /tmp/bundle.tar
            if [ -f _b64/bundle/sha256 ]; then
              echo "$(tr -d '[:space:]' < _b64/bundle/sha256)  /tmp/bundle.tar" | sha256sum -c -
            fi
            tar -xvf /tmp/bundle.tar
          fi

          find _b64 -type f -name '*.b64' -print | sort | while IFS= read -r f; do
            rel="${f#_b64/}"
            dest="${rel%.b64}"
            mkdir -p "$(dirname "$dest")"
            base64 -d "$f" > "$dest"
            echo "decoded $f -> $dest ($(wc -c < "$dest") bytes)"
          done

          git rm -r -q _b64

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Decode uploaded base64 images into place"
          git push
